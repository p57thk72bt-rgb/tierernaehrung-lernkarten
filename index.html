<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tierernährung Lernkarten</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .header {
    width: 100%;
    max-width: 700px;
    padding: 20px;
    text-align: center;
  }
  .header h1 {
    font-size: 22px;
    color: #2c3e50;
    margin-bottom: 6px;
  }
  .progress-text {
    color: #666;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .progress-bar-bg {
    width: 100%;
    background: #ddd;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: #4caf50;
    width: 0%;
    transition: width 0.3s ease;
  }
  .card {
    background: white;
    width: 90%;
    max-width: 650px;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 40px 30px;
    margin-top: 20px;
    text-align: center;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .question {
    font-size: 20px;
    color: #1a1a1a;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .answer {
    font-size: 18px;
    color: #2c7a2c;
    background: #eaf7ea;
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 10px;
    line-height: 1.5;
    display: none;
  }
  .btn-show {
    background: #2c3e50;
    color: white;
    border: none;
    padding: 14px 30px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 20px;
    align-self: center;
  }
  .btn-show:hover { background: #1a2733; }
  .rating-buttons {
    display: none;
    margin-top: 24px;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .rating-buttons button {
    flex: 1;
    min-width: 110px;
    padding: 14px 10px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-again { background: #e53935; }
  .btn-again:hover { background: #c62828; }
  .btn-hard { background: #fb8c00; }
  .btn-hard:hover { background: #ef6c00; }
  .btn-good { background: #7cb342; }
  .btn-good:hover { background: #558b2f; }
  .btn-easy { background: #2e7d32; }
  .btn-easy:hover { background: #1b5e20; }
  .done-message {
    background: white;
    width: 90%;
    max-width: 650px;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 50px 30px;
    margin-top: 20px;
    text-align: center;
  }
  .done-message h2 { color: #2e7d32; margin-bottom: 12px; }
  .done-message p { color: #444; font-size: 15px; margin: 6px 0; }
  .reset-link {
    margin-top: 30px;
    font-size: 13px;
    color: #999;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Tierernährung – Prüfungsvorbereitung</h1>
  <div class="progress-text" id="progressText">Lade...</div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
</div>

<div id="cardArea"></div>

<div class="reset-link" id="resetLink" style="display:none;">Lernfortschritt zurücksetzen</div>

<script>
const QA_DATA = [["Wie berechnet man den Proteingehalt eines Trockenfutters (16% Protein, 10% Feuchte) auf Trockensubstanz (TS)?", "16 × 100/90 = 17,75 g Protein pro 100 g TS"], ["Was ist die Formel für die umsetzbare Energie (ME)?", "Bruttoenergie minus Energie, die über Kot und Harn verloren geht"], ["Warum hat Zellulose eine hohe Bruttoenergie, aber eine niedrige ME?", "Weil Hund und Katze Zellulose kaum verdauen können"], ["Was bedeutet \"Rohasche\" in der Futtermitteldeklaration?", "Gesamtheit aller Mineralstoffe (z. B. Ca, P, Mg, Silikate), die nach dem Verbrennen des Futters übrig bleiben – sagt nichts über die genaue Zusammensetzung aus"], ["Worauf muss man bei Trägerstoffen bei Futterallergikern achten?", "Der Trägerstoff kann selbst ein Protein sein und eine allergische Reaktion auslösen"], ["Welche Steinart kann durch Fütterung tatsächlich aufgelöst werden?", "Nur Struvitsteine; bei allen anderen Steinarten ist nur eine Rezidivprophylaxe möglich"], ["Wie viel Lamm muss laut Deklaration in einem Futter \"mit Lamm und Reis\" mindestens enthalten sein?", "Nur 4%"], ["Was ist das ideale Verhältnis von Omega-6 zu Omega-3-Fettsäuren?", "4 : 1 (Linolsäure zu Alpha-Linolensäure)"], ["Warum sollte man bei Katzen mit Allergie Ölkapseln (z. B. Krillöl) immer öffnen?", "Damit nur der Ölinhalt verfüttert wird und kein Protein aus der Kapselhülle aufgenommen wird"], ["Ab welcher Trächtigkeitswoche sollte der Energiebedarf der Hündin gesteigert werden und um wie viel?", "Ab der 4. Woche, auf das 1,5-Fache des Erhaltungsbedarfs"], ["Warum brauchen trächtige Hündinnen viel Kohlenhydrate?", "Die Feten benötigen Glukose als Energiequelle"], ["Welche Fettsäure fördert die Hirnentwicklung und Lernfähigkeit der Feten?", "Omega-3-Fettsäuren"], ["Warum ist BARF bei trächtigen Hündinnen nicht empfohlen?", "Hygienerisiko für die Welpen (z. B. Yersinien-Infektionen)"], ["Welchem Tier ist die Hundemilch am ähnlichsten, welchem die Katzenmilch?", "Hundemilch ähnelt der Schweinemilch, Katzenmilch der Ziegenmilch"], ["Wie hoch ist der Mindestproteinbedarf (verdauliches Rohprotein, TS) während der Laktation bei Hund und Katze?", "Hund mind. 25%, Katze mind. 35%"], ["Welche Hunderassen haben ein erhöhtes Eklampsie-Risiko?", "Pinscher, Malteser, Zwergpudel, v. a. Erstgebärende"], ["Warum sollte ein Welpe/Kätzchen vor 6 Monaten kein BARF bekommen?", "Magen-pH ist noch nicht tief genug, Immunabwehr ist noch nicht vollständig ausgebildet"], ["Wie unterscheidet sich die Amylaseaktivität im Pankreas zwischen Hund und Katze?", "Katze: fast null; Hund: hoch (Ausnahme: ursprüngliche Rassen wie Husky, Border Collie mit niedrigerer Aktivität)"], ["Wie lange kann Kolostrum eingefroren werden?", "Bis zu einem Jahr"], ["Warum sollte man bei alten Hunden kein BARF mehr füttern?", "Weniger Magensäure und eingeschränkte Absorptionsfähigkeit erhöhen das Infektionsrisiko"], ["Ab welchem Alter steigt der Energie- und Proteinbedarf bei Senior-Katzen wieder an?", "Ab ca. 12 Jahren"], ["Welche Nährstoffe werden bei Senioren mit kognitiver Dysfunktion im doppelten Bedarf gegeben?", "Zink und Vitamin E"], ["Was bedeutet \"Homöorhese\" im Zusammenhang mit der Laktation?", "Die Milchzusammensetzung bleibt bei Energiemangel konstant, es sinkt nur die produzierte Milchmenge"], ["Wie viel Prozent des Körpergewichts wird bei Hündin, Kätzin und Kuh pro Tag als Milch produziert?", "Ca. 8%"], ["In welcher Laktationswoche produziert die Hündin am meisten Milch?", "In der 3. Laktationswoche"], ["Wie hoch ist der Fettbedarf (TS) während der Laktation bei Hund und Katze?", "Hund über 10%, Katze 18–35%"], ["Um wie viel wird der Erhaltungsbedarf pro Welpe in der 3.–5. Laktationswoche erhöht?", "Ungefähr um 1/4 des Erhaltungsbedarfs pro Welpe"], ["Ab wann frühestens und spätestens kann eine Kätzin ihre Jungen absetzen?", "Frühestens ab 7 Wochen, kann aber auch bis 11 Wochen dauern"], ["Welche Fasergrenze gilt für die Fütterung der Hündin während der Laktation?", "Faseranteil unter 5% der TS, Rohasche ebenfalls niedrig halten"], ["Warum ist Erbrechen bei laktierenden Hündinnen bis zu 1x pro Tag normal?", "Es ist ein natürliches Verhalten (wie beim Wolf), solange der Allgemeinzustand gut ist"], ["Ab welchem Alter sollte man bei einer trächtigen Hündin auf Welpenfutter umstellen und wie?", "Ab dem 28. Trächtigkeitstag, über 2 Wochen langsam umstellen"], ["Ab welcher Laktationswoche sollten Welpen zugefüttert werden?", "Ab der 3. Woche, das entlastet die Hündin"], ["Woher stammt Taurin hauptsächlich, das bei Katzen ergänzt werden muss?", "Aus Fleisch/tierischen Produkten (z. B. Rinderhoden bei Supplementen)"], ["Was ist Arachidonsäure und warum ist sie bei Katzen wichtig?", "Eine Omega-6-Fettsäure aus Fleisch, die die Katze nicht selbst synthetisieren kann"], ["Welche pflanzliche Ölquelle liefert Linolsäure (Omega-6)?", "Sonnenblumenöl, Distelöl, Rapsöl, Hanföl"], ["Welche Ölquelle liefert Alpha-Linolensäure (Omega-3)?", "Leinöl und Fischöl"], ["Warum sollte man Omega-3-Öle (z. B. Leinöl) kühl lagern?", "Sie oxidieren leicht und werden dadurch unwirksam bzw. schädlich"], ["Was passiert mit dem Vitamin-A-Gehalt bei längerer Lagerung von Futter?", "Er nimmt ab, abgelaufenes Futter deckt den Bedarf möglicherweise nicht mehr"], ["Auf wieviel Prozent des Erhaltungsbedarfs sollte Phosphor bei fortgeschrittener CNI reduziert werden?", "60–70%"], ["Welches Ca:P-Verhältnis wird bei Nierenpatienten angestrebt?", "Über 2:1"], ["Was passiert bei sekundärem renalem Hyperparathyreoidismus mit Calcium und Vitamin D?", "Parathormon steigt; Calciumbedarf senken, Vitamin D anpassen, Vitamin E erhöhen"], ["Was ist der Grundsatz der Lebererkrankungs-Diätetik bezüglich Protein?", "Purinarm füttern, aber NICHT proteinarm"], ["Bei welcher Tierart ist Arginin essenziell für den Harnstoffzyklus?", "Bei der Katze (der Hund kann es im Darm selbst synthetisieren)"], ["Wie hoch darf die Kupferzufuhr bei Leberpatienten maximal über dem Bedarf liegen?", "Nie mehr als das Zweifache"], ["Wie hoch darf die Vitamin-A-Zufuhr bei Leberpatienten maximal über dem Bedarf liegen?", "Nie mehr als das Zweifache"], ["Welche Aminosäure fördert den Fettabbau bei Fettleber?", "Methionin"], ["Warum sollten Milchprodukte bei purinarmer Leberdiät bevorzugt werden?", "Sie sind purinarm (keine Zellkerne wie im Muskelfleisch)"], ["Warum ist Ei bei Leberpatienten geeignet, aber nicht ganz unbedenklich?", "Ei ist purinarm, aber es entstehen Mercaptane, die die Leber entgiften muss"], ["Was passiert bei mikrobieller Aktivität im Dickdarm bei Leberpatienten?", "Es entsteht vermehrt Ammoniak, das die Leber belastet"], ["Wie hoch sollte der Rohfasergehalt bei Leberpatienten maximal sein?", "Nicht mehr als 3%"], ["Welche zwei Zucker können bei Leberpatienten zur Azidierung eingesetzt werden, haben aber auch eine abführende Wirkung?", "Laktose und Laktulose"], ["Warum ist Pansen bei Leber- oder Nierenpatienten ungeeignet, obwohl er lebensmitteltauglich ist?", "Er hat viel Bindegewebe und ist trotz Lebensmittelqualität schwer verdaulich"], ["Wie lange darf ein Hund/eine Katze im akuten Fall maximal fasten (neue Studie)?", "Max. 12 Stunden"], ["Was ist AHDS und was ist häufig die Ursache?", "Akutes hämorrhagisches Diarrhoe-Syndrom, häufig durch Clostridium perfringens-Toxine ausgelöst, oft nach Hitzestress"], ["Wie sollten Pankreasenzyme (z. B. Lypex) bei EPI verabreicht werden?", "Ins Futter einmischen und vor der Fütterung einwirken lassen"], ["Sollte bei Pankreatitis gefastet werden?", "Nein, laut neuer Studie nicht mehr fasten"], ["Wie hoch ist die Vitamin-A-Schmerzgrenze bei Hund und Katze?", "5-fach des Bedarfs beim Hund, 3-fach bei der Katze"], ["Welchen Effekt haben lösliche vs. unlösliche Fasern auf die Peristaltik?", "Lösliche Fasern verzögern die Peristaltik (Magenentleerung), unlösliche fördern sie"], ["Welche Faserquelle (Flohsamenschale) hat ein 1:1-Verhältnis von löslichen zu unlöslichen Fasern?", "Psyllium"], ["Welche Dosierung von Psyllium wird als Richtwert empfohlen?", "Ca. 1 g pro kg Körpergewicht"], ["Welches Gemüse gilt als gute Mischquelle für lösliche und unlösliche Fasern?", "Fenchel"], ["Was ist bei akutem Durchfall/Erbrechen laut neuer Erkenntnis zu beachten (Fastenzeit)?", "Maximal 12 Stunden fasten lassen, nicht länger, wegen Refeeding-Syndrom"], ["Welches klassische Hausmittel-Verhältnis wird bei Durchfall (Reis/Poulet) empfohlen?", "1/3 Fleisch zu 2/3 Reis oder Kartoffeln"], ["Was kann bei EPI als Alternative zu Lypex verwendet werden, wenn dieses nicht wirkt?", "Das Humanpräparat CREON"], ["Wie kann man rohen Schweinepankreas bei EPI selbst haltbar machen?", "Im Dörrautomat bei max. 60°C trocknen, dann zu Pulver mahlen (Enzyme bleiben aktiv)"], ["Welche Dosierung von getrocknetem Schweinepankreas wird bei EPI empfohlen?", "5 Gramm pro kg Hund"], ["Warum sollte man bei IBD/PLE anfangs den Proteingehalt verdoppeln?", "Um dem tiefen Albuminspiegel (ALB) entgegenzuwirken"], ["Wie hoch sollte der Rohfettgehalt bei PLE mit niedrigem Fettgehalt liegen (pro 100 g TS)?", "Ca. 10 Gramm pro 100 g Trockensubstanz"], ["Ab welchem Fasergehalt sinkt die Verdaulichkeit bei PLE-Patienten deutlich?", "Ab ca. 7 g pro 100 g Trockensubstanz"], ["Welche Rolle spielen Cortisol und Vitamin B12 bei der klinischen Ernährungsbeurteilung?", "Beide sollten bei GIT-Patienten immer als Basiswerte gemessen werden"], ["Was bedeutet \"Pica\" bei Tieren?", "Das Fressen von nicht nahrhaften Substanzen (z. B. Steine, Katzenstreu), oft bei Stress oder Anämie"], ["Warum braucht es beim Short-Bowel-Syndrom hochdosiertes orales Vitamin B12?", "Ohne Intrinsic Factor kann B12 im Ileum nicht mehr aktiv aufgenommen werden, nur noch passiv bei hoher Dosis"], ["Was ist eine funktionale Dyspepsie?", "Ein stressbedingter Reizmagen bei Tieren (neuere Studienerkenntnis)"], ["Welche Substanz in Proenteric bindet Toxine bei AHDS?", "Vulkangestein"], ["Warum sollte man bei stationären Patienten immer mit dem Ruheenergiebedarf (RER) rechnen?", "Da der Energieumsatz bei Krankheit/Immobilität reduziert ist gegenüber dem normalen Erhaltungsbedarf"], ["Was ist der Unterschied zwischen Rohprotein (RP) und verdaulichem Rohprotein (vRP)?", "RP ist der analytische Gesamtwert, vRP berücksichtigt zusätzlich, wie viel davon tatsächlich resorbiert werden kann"], ["Welcher Anteil der Atopiker ist gleichzeitig Futterallergiker?", "1/3 (2/3 sind reine Atopiker)"], ["Warum sind Bluttests (IgE) bei Futtermittelallergie oft wenig aussagekräftig?", "FMA zeigt meist T-Zell-vermittelte Spätreaktionen statt IgE-vermittelter Sofortreaktionen"], ["Wie lange sollte eine Eliminationsdiät bei Verdacht auf Futtermittelallergie durchgeführt werden?", "6–8 Wochen mit neuer Fleisch- und neuer Kohlenhydratquelle"], ["Warum ist BARF für Ausschlussdiäten ungeeignet?", "Kreuzreaktionen über Albumin, die durch Erhitzen des Fleisches vermieden werden könnten"], ["Bei welcher Hunderasse tritt Glutenintoleranz bekanntermaßen auf?", "Beim Setter"], ["Welches Prinzip gilt bei der Fütterung von Struvitsteinen und welcher Ziel-pH wird angestrebt?", "Ansäuern (z. B. mit Methionin), Ziel-pH ca. 6,5"], ["Welches Fütterungsprinzip gilt bei Calciumoxalatsteinen?", "Wasseraufnahme erhöhen zur Urinverdünnung, kein Bindegewebe als Kauartikel geben"], ["Bei welcher Hunderasse treten Uratsteine typischerweise auf und wie füttert man?", "Dalmatiner; purinarm füttern, 50% Milch/Ei/Soja + 50% Muskelfleisch, keine Innereien"], ["Welcher Ziel-pH-Bereich wird bei Uratsteinen angestrebt?", "6,5–7,2"], ["Worauf muss man bei Silikatsteinen in der Fütterung besonders achten?", "Sehr wenig Fasergehalt, Vorsicht bei veganer Fütterung"], ["Was kann bei Cystinsteinen prophylaktisch zur Löslichkeitserhöhung gegeben werden?", "Vitamin C"], ["Welche zwei Schlüsselaminosäuren sind für die Harnansäuerung bei Struvitsteinen relevant?", "Methionin und Cystin"], ["Wie lautet der neutrale Ziel-Urin-pH-Bereich beim Hund laut Kursnotizen?", "6,9–7,1"], ["Warum sollte man bei der Fütterung mit ansäuernden Substanzen (z. B. Methionin) auf zu lange Anwendung achten?", "Zu lange säuernde Substanzen können ebenfalls Nebenwirkungen haben"], ["Welche wöchentliche Gewichtsreduktion wird bei Katze und Hund angestrebt?", "Katze 1–2%/Woche, Hund 2%/Woche"], ["Warum ist Halbfeuchtfutter (z. B. Frolic) für Diabetiker ungeeignet?", "Enthält insulinwirksame Zusatzstoffe und Zucker als Konservierungsmittel"], ["Welches Getreide eignet sich gut für Diabetiker-Hunde, da es langsam verstoffwechselt wird?", "Hirse"], ["Warum sind kohlenhydratarme Diäten bei Tumorpatienten nicht generell evidenzbasiert?", "Es gibt keine Studien, die einen positiven Effekt einer kohlenhydratarmen Fütterung auf die Tumorerkrankung belegen"], ["Wann sollten Antioxidantien bei Tumorpatienten während Chemo-/Strahlentherapie abgesetzt werden?", "1 Woche vor bis 1 Woche nach der Therapie"], ["Warum ist eine vegane Ernährung bei Katzen nicht möglich?", "Taurin, Vitamin A und D stammen aus tierischen Quellen; Katzen können Betacarotin nicht zu Vitamin A umwandeln"], ["Können Hunde Betacarotin zu Vitamin A umwandeln?", "Ja, im Gegensatz zu Katzen"], ["Welches Grundprinzip gilt praktisch immer bei kranken oder jungen Tieren bezüglich BARF?", "Generell von BARF abraten und stattdessen selbst gekochte oder kommerzielle Diäten empfehlen (Hygiene, Verdaulichkeit, Nährstoffkontrolle)"]];
const STORAGE_KEY = "tierernaehrung_lernstatus_v1";

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function addDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + Math.round(days));
  return d.toISOString().slice(0,10);
}

function loadStatus() {
  let raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  let status = {};
  QA_DATA.forEach((qa, idx) => {
    status[idx] = {
      naechste: todayStr(),
      intervall: 1,
      wiederholungen: 0
    };
  });
  saveStatus(status);
  return status;
}

function saveStatus(status) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(status));
}

let status = loadStatus();
let today = todayStr();

function getDueIndices() {
  let due = [];
  for (let idx in status) {
    if (status[idx].naechste <= today) due.push(parseInt(idx));
  }
  // shuffle
  for (let i = due.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [due[i], due[j]] = [due[j], due[i]];
  }
  return due;
}

let dueQueue = getDueIndices();
let totalDueAtStart = dueQueue.length;
let answeredCount = 0;
let againCount = 0;

function totalReviewed() {
  let c = 0;
  for (let idx in status) if (status[idx].wiederholungen > 0) c++;
  return c;
}

function updateProgressUI() {
  const progressText = document.getElementById("progressText");
  const progressBar = document.getElementById("progressBar");
  if (totalDueAtStart === 0) {
    progressText.textContent = "Fortschritt gesamt: " + totalReviewed() + " / " + QA_DATA.length + " Fragen gelernt";
    progressBar.style.width = Math.round((totalReviewed() / QA_DATA.length) * 100) + "%";
  } else {
    progressText.textContent = "Frage " + (answeredCount) + " von " + totalDueAtStart + " fällig heute  •  Gesamt: " + totalReviewed() + " / " + QA_DATA.length;
    progressBar.style.width = Math.round((answeredCount / totalDueAtStart) * 100) + "%";
  }
}

function nextNiceDueDate() {
  let dates = [];
  for (let idx in status) dates.push(status[idx].naechste);
  dates.sort();
  for (let d of dates) if (d > today) return d;
  return null;
}

function renderDone() {
  const area = document.getElementById("cardArea");
  let nextDate = nextNiceDueDate();
  let msg = "<div class='done-message'><h2>Super, alles erledigt für heute!</h2>";
  msg += "<p>Beantwortete Fragen heute: " + answeredCount + "</p>";
  msg += "<p>Davon 'Nochmal' (morgen zuerst wieder dran): " + againCount + "</p>";
  if (nextDate) {
    msg += "<p>Nächste fällige Wiederholung ab: " + nextDate + "</p>";
  } else {
    msg += "<p>Alle Fragen sind aktuell gelernt.</p>";
  }
  msg += "</div>";
  area.innerHTML = msg;
  document.getElementById("resetLink").style.display = "block";
  updateProgressUI();
}

function renderCard() {
  if (dueQueue.length === 0) {
    renderDone();
    return;
  }
  const idx = dueQueue[0];
  const qa = QA_DATA[idx];
  const area = document.getElementById("cardArea");
  area.innerHTML = `
    <div class="card">
      <div class="question">${qa[0]}</div>
      <div class="answer" id="answerBox">${qa[1]}</div>
      <button class="btn-show" id="showBtn">Antwort zeigen</button>
      <div class="rating-buttons" id="ratingButtons">
        <button class="btn-again" data-rating="again">Nochmal</button>
        <button class="btn-hard" data-rating="hard">Schwer</button>
        <button class="btn-good" data-rating="good">Gut</button>
        <button class="btn-easy" data-rating="easy">Leicht</button>
      </div>
    </div>
  `;
  document.getElementById("showBtn").addEventListener("click", () => {
    document.getElementById("answerBox").style.display = "block";
    document.getElementById("showBtn").style.display = "none";
    document.getElementById("ratingButtons").style.display = "flex";
  });
  document.querySelectorAll("#ratingButtons button").forEach(btn => {
    btn.addEventListener("click", () => handleRating(idx, btn.dataset.rating));
  });
  updateProgressUI();
}

function handleRating(idx, rating) {
  let s = status[idx];
  let currentInterval = s.intervall || 1;
  let newInterval;
  if (rating === "again") {
    newInterval = 1;
    againCount++;
  } else if (rating === "hard") {
    newInterval = Math.max(1, currentInterval * 1.3);
  } else if (rating === "good") {
    newInterval = currentInterval * 2.0;
  } else if (rating === "easy") {
    newInterval = currentInterval * 3.0;
  }
  s.intervall = newInterval;
  s.naechste = addDays(today, newInterval);
  s.wiederholungen = (s.wiederholungen || 0) + 1;
  status[idx] = s;
  saveStatus(status);

  answeredCount++;
  dueQueue.shift();
  renderCard();
}

document.getElementById("resetLink").addEventListener("click", () => {
  if (confirm("Wirklich den gesamten Lernfortschritt zurücksetzen?")) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

renderCard();
</script>

</body>
</html>
